[project]
name = "camera-radar-3d-detection"
version = "0.1.0"
description = "Camera-radar fusion for 3D object detection on nuScenes (detection-level, mid-level, and early-fusion designs)"
requires-python = ">=3.10,<3.11"
dependencies = [
    "openmim>=0.3.9",
    "setuptools>=60.2.0",
    "torch==2.4.0",
    "torchaudio==2.4.0",
    "torchvision==0.19.0",
    "mmengine==0.10.7",
    "mmcv==2.2.0",
    "mmdet==3.3.0",
    "mmdet3d==1.4.0",
    "ultralytics>=8.0",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

# mmcv has no PyPI sdist that builds cleanly — use the prebuilt CUDA wheel directly.
# For other CUDA/torch versions see: https://download.openmmlab.com/mmcv/dist/
[tool.uv.sources]
mmcv = { url = "https://download.openmmlab.com/mmcv/dist/cu121/torch2.4.0/mmcv-2.2.0-cp310-cp310-manylinux1_x86_64.whl" }
